# A minimal, reproducible two-source Zephon mixture.
# Relative paths are resolved from this recipe file.

text_field = "text"
seed = 42
# The checked-in sources contain four samples each. Eight samples per work
# chunk keeps the small smoke test from producing a warning for nearly every
# batch; real datasets can use a much larger value.
chunk_size = 8

[[sources]]
name = "prose"
path = "../../tests/assets/zephon_mixture/prose"

[[sources]]
name = "code"
path = "../../tests/assets/zephon_mixture/code"
