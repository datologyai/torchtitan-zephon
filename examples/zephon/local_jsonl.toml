# A minimal, reproducible two-source Zephon mixture.
# Relative paths are resolved from this recipe file.

tokenizer_path = "../../tests/assets/tokenizer"
text_field = "text"
seed = 42
# The checked-in sources contain four samples each. Real datasets can use a
# much larger chunk size.
chunk_size = 2

[[sources]]
name = "prose"
path = "../../tests/assets/zephon_mixture/prose"

[[sources]]
name = "code"
path = "../../tests/assets/zephon_mixture/code"
