# A local mixture whose requested distribution is 75% prose and 25% code.
# Relative paths are resolved from this recipe file.

tokenizer_path = "../../tests/assets/tokenizer"
text_field = "text"
seed = 42
chunk_size = 4

[[sources]]
name = "prose"
path = "../../tests/assets/zephon_mixture/prose"
fmt = "jsonl"
weight = 3.0

[[sources]]
name = "code"
path = "../../tests/assets/zephon_mixture/code"
fmt = "jsonl"
weight = 1.0
