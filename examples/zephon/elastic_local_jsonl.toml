# The common two-canonical-lane recipe shared by the reference integrations.
# Supply aggregate_dir and run_id at launch time because they identify a
# particular shared run, not this reusable data recipe.

text_field = "text"
seed = 42
chunk_size = 4
canonical_replicas = 2

[[sources]]
name = "prose"
path = "../../tests/assets/zephon_mixture/prose"
fmt = "jsonl"
weight = 3.0

[[sources]]
name = "code"
path = "../../tests/assets/zephon_mixture/code"
fmt = "jsonl"
weight = 1.0
