name: Model Tests

on:
  push:
    branches: [ main ]
    tags:
      - ciflow/8gpu/*
    paths-ignore:
      - 'torchtitan/experiments/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths-ignore:
      - 'torchtitan/experiments/**'
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'

concurrency:
  group: unit-test${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l -eo pipefail {0}

permissions:
  id-token: write
  contents: read

jobs:
  set-matrix-fake-pg:
    if: github.repository_owner == 'pytorch' || github.event_name != 'schedule'
    uses: ./.github/workflows/set-matrix.yaml
    with:
      runner-cuda: mt-l-x86aavx2-29-113-a10g
      gpu-arch: cuda

  models-fake-pg:
    name: 1 GPU Models (Fake PG)
    needs: set-matrix-fake-pg
    if: ${{ needs.set-matrix-fake-pg.outputs.matrix != '' && fromJSON(needs.set-matrix-fake-pg.outputs.matrix).include[0] != null }}
    uses: pytorch/test-infra/.github/workflows/linux_job_v3.yml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix-fake-pg.outputs.matrix) }}
    with:
      runner: ${{ matrix.runner }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/torchtitan/${{ matrix.docker-image }}:${{ needs.set-matrix-fake-pg.outputs.docker-hash }}
      repository: pytorch/torchtitan
      upload-artifact: outputs
      timeout: 60
      script: |
        set -eux

        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        export HF_HOME="$RUNNER_TEMP/hf_home"
        export HF_DATASETS_CACHE="$RUNNER_TEMP/hf_home/datasets"

        DRIVER_VERSION=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n 1 || true)
        echo "CUDA driver version: ${DRIVER_VERSION}"

        pip config --user set global.progress_bar off

        python -m pip install --force-reinstall --pre \
          torch torchvision --index-url ${{ matrix.index-url }}
        USE_CPP=0 python -m pip install --pre torchao --index-url ${{ matrix.index-url }}

        mkdir -p "$RUNNER_TEMP/artifacts-to-be-uploaded"

        # TODO: Add 1-GPU model numerics here so it shares this runner.
        python -m tests.integration_tests.run_tests \
          --gpu_arch_type cuda \
          --test_suite models_fake_pg \
          --ngpu 1 \
          "$RUNNER_TEMP/artifacts-to-be-uploaded"
        python -m tests.integration_tests.flux \
          --test_suite flux_fake_pg \
          --ngpu 1 \
          "$RUNNER_TEMP/artifacts-to-be-uploaded/flux"

        rm -rf $RUNNER_TEMP/artifacts-to-be-uploaded/*/checkpoint
        rm -rf $RUNNER_TEMP/artifacts-to-be-uploaded/flux/*/inference_results/

  set-matrix-real-pg:
    if: github.repository_owner == 'pytorch' || github.event_name != 'schedule'
    uses: ./.github/workflows/set-matrix.yaml
    with:
      gpu-arch: cuda

  models-real-pg:
    name: 8 GPU Models (Real PG)
    needs: set-matrix-real-pg
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix-real-pg.outputs.matrix) }}
    with:
      runner: ${{ matrix.runner }}
      gpu-arch-type: ${{ matrix.gpu-arch-type }}
      gpu-arch-version: ${{ matrix.gpu-arch-version }}
      docker-image: ${{ matrix.docker-image }}
      repository: pytorch/torchtitan
      upload-artifact: outputs
      timeout: 60
      script: |
        set -eux

        # The generic Linux job chooses to use base env, not the one setup by the image
        CONDA_ENV=$(conda env list --json | jq -r ".envs | .[-1]")
        conda activate "${CONDA_ENV}"

        DRIVER_VERSION=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n 1 || true)
        echo "CUDA driver version: ${DRIVER_VERSION}"

        pip config --user set global.progress_bar off

        TORCH_SPEC="torch"
        if [ -n "${{ matrix.torch-version }}" ]; then
          TORCH_SPEC="torch==${{ matrix.torch-version }}"
        fi
        python -m pip install --force-reinstall --pre \
          "${TORCH_SPEC}" torchvision --index-url ${{ matrix.index-url }}

        USE_CPP=0 python -m pip install --pre torchao --index-url ${{ matrix.index-url }}

        sudo mkdir -p "$RUNNER_TEMP/artifacts-to-be-uploaded"
        sudo chown -R $(id -u):$(id -g) "$RUNNER_TEMP/artifacts-to-be-uploaded"

        # TODO: Add 8-GPU model numerics here so it shares this runner.
        python -m tests.integration_tests.run_tests \
          --gpu_arch_type ${{ matrix.gpu-arch-type }} \
          --test_suite models_real_pg \
          --ngpu 8 \
          "$RUNNER_TEMP/artifacts-to-be-uploaded"
        python -m tests.integration_tests.flux \
          --test_suite flux_real_pg \
          --ngpu 8 \
          "$RUNNER_TEMP/artifacts-to-be-uploaded/flux"

        rm -rf $RUNNER_TEMP/artifacts-to-be-uploaded/*/checkpoint
        rm -rf $RUNNER_TEMP/artifacts-to-be-uploaded/flux/*/inference_results/
