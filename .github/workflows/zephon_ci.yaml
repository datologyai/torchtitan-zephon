name: Zephon CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: zephon-ci-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The upstream Lint workflow is disabled in this fork, so call it directly.
  lint:
    uses: ./.github/workflows/lint.yaml

  zephon-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure access to the private Zephon repo
        env:
          ZEPHON_READ_TOKEN: ${{ secrets.ZEPHON_READ_TOKEN }}
        run: |
          if [ -z "${ZEPHON_READ_TOKEN}" ]; then
            echo "::error::ZEPHON_READ_TOKEN is unavailable (fork or Dependabot PR?)"
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${ZEPHON_READ_TOKEN}@github.com/datologyai/zephon".insteadOf \
            "https://github.com/datologyai/zephon"
      - name: Install CPU dependencies
        run: |
          python -m pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          python -m pip install -r requirements.txt -r requirements-zephon.txt pytest
      - name: Check Zephon is importable
        # The tests use pytest.importorskip("zephon"); fail here instead of
        # letting a broken install turn the whole suite into skips.
        run: python -c "import zephon; print(zephon.__file__)"
      - name: Test Zephon integration
        run: python -m pytest tests/unit_tests/test_zephon_dataloader_override.py -q -rs
