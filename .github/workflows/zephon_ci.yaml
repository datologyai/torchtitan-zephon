name: Zephon CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: zephon-ci-${{ github.ref == 'refs/heads/main' && github.run_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mirrors upstream lint.yaml (disabled in this fork), split in two: every
  # hook except pyrefly runs in pre-commit's own envs, so only typecheck needs
  # the full dependency install.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Lychee (v0.24.1)
        run: |
          VERSION="v0.24.1"
          URL="https://github.com/lycheeverse/lychee/releases/download/lychee-${VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p lychee_install
          curl -sL "$URL" | tar -xz -C lychee_install --strip-components=1
          sudo mv lychee_install/lychee /usr/local/bin/
          rm -rf lychee_install
      - name: Restore Lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Restore pre-commit cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit install-hooks
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v45.0.6
      - name: Lint modified files
        if: github.event_name == 'pull_request'
        env:
          SKIP: lychee-link-checker,pyrefly-check
        run: pre-commit run --show-diff-on-failure --files ${{ steps.changed-files.outputs.all_changed_files }}
      - name: Lint all files
        if: github.event_name != 'pull_request'
        env:
          # no-commit-to-branch always fails when linting a push to main.
          SKIP: lychee-link-checker,pyrefly-check,no-commit-to-branch
        run: pre-commit run --show-diff-on-failure --all-files
      - name: Check links with Lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pre-commit run lychee-link-checker --all-files

  # pyrefly type-checks the whole repo against the installed environment, so
  # it needs the full install (CPU torch nightly: the CUDA wheels exhaust disk
  # on standard runners). PRs that touch no Python skip it.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check for Python changes
        id: py-changes
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v45.0.6
        with:
          files: '**/*.py'
      - name: Decide whether to type-check
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.py-changes.outputs.any_changed == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install --force-reinstall --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          python -m pip install --no-deps "git+https://github.com/meta-pytorch/torch_checkpointing.git@main"
      - name: Run pyrefly
        if: steps.gate.outputs.run == 'true'
        run: pre-commit run pyrefly-check --all-files

  zephon-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          python -m pip install -r requirements.txt -r requirements-zephon.txt pytest
          # The elastic resume tests launch torchrun subprocesses that import
          # torchtitan, so it must be installed rather than only on pytest's path.
          python -m pip install --no-deps -e .
      - name: Check Zephon is importable
        # The tests use pytest.importorskip("zephon"); fail here instead of
        # letting a broken install turn the whole suite into skips.
        run: python -c "import zephon; print(zephon.__file__)"
      - name: Test Zephon integration
        run: python -m pytest tests/unit_tests/test_zephon_dataloader.py -q -rs
