name: Zephon CPU Unit Test

on:
  pull_request:
    paths:
      - 'torchtitan/overrides/zephon_dataloader.py'
      - 'tests/unit_tests/test_zephon_dataloader_override.py'
      - 'examples/zephon/**'
      - 'requirements*.txt'
      - '.github/workflows/zephon_unit_test.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cpu
          python -m pip install -r requirements.txt -r requirements-zephon.txt pytest
      - name: Test Zephon integration
        run: python -m pytest tests/unit_tests/test_zephon_dataloader_override.py -q
